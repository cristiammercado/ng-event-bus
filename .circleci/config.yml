version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:24.18
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-npm-cache-{{ checksum "package-lock.json" }}
            - v2-npm-cache-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: v2-npm-cache-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Build library and demo
          command: npm run build:all
      - run:
          name: Test and collect coverage
          command: npm run test:coverage
      - store_artifacts:
          path: coverage
          destination: coverage

workflows:
  test-and-build:
    jobs:
      - build
